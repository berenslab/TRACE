[project]
name = "trace-neuro"
version = "0.1.0"
description = "Contrastive learning for multi-trial time-series data in neuroscience"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Lisa Schmors" }]
dependencies = [
    "torch>=2.0",
    "lightning>=2.0",
    "tsimcne==0.4.13",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "h5py>=3.16.0",
]

[project.scripts]
trace = "trace_neuro.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_neuro"]

[dependency-groups]
dev = ["pytest", "ruff"]
